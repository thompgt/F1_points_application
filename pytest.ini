[pytest]
testpaths = tests

# The tests import main and scoring, which live at the repo root while the tests
# live in tests/. With the default prepend import mode pytest puts tests/ on
# sys.path, not the root, so `import scoring` resolves only by accident of how
# the runner happened to be invoked -- it worked from a local shell and failed
# outright in CI. Say it explicitly instead.
pythonpath = .

# Third-party deprecation noise (pytz, and health.py's datetime.utcnow) drowns
# out real warnings; filter the known ones rather than silencing everything.
filterwarnings =
    ignore::DeprecationWarning:pytz.*
