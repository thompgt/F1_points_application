name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One version, because requirements.txt is a lock and a lock is resolved
        # for one interpreter. It was briefly a 3.11/3.13 matrix and the 3.11 job
        # failed on `No matching distribution found for numpy==2.5.2` -- numpy 2.5
        # requires Python >=3.12. Testing a version you cannot install the lock on
        # tests something nobody deploys.
        python-version: ["3.13"]

    env:
      # No MySQL service here on purpose. load_data() falls back to the seed CSVs
      # when the database is unreachable, and that fallback is a documented,
      # supported path -- running the suite against it means CI exercises the
      # code a fresh clone actually runs.
      DATABASE_URL: ""
      # The burst limiter (10 req/sec) trips on a fast suite hitting endpoints
      # back to back from one host. conftest.py sets this too; belt and braces.
      ENABLE_RATE_LIMITING: "false"
      # Keeps the head-to-head tests off the network.
      ENABLE_FASTF1_QUALI_GAP: "false"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Check the seed data is present
        # The suite scores whole eras of results.csv against Ergast's own points
        # column, so a missing or truncated CSV has to fail loudly here rather
        # than as a confusing assertion error 300 lines later.
        run: python scripts/fetch_data.py --check

      - name: Test
        run: pytest tests/ -q --durations=10

  import-check:
    name: Import without optional extras
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Import the app with no .env and no database
        # Catches the class of breakage where a module reads a setting at import
        # time and a fresh clone cannot start at all.
        run: python -c "import main; print(main.app.title)"
